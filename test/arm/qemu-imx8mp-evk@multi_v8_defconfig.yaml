targets:
  main:
    drivers:
      QEMUDriver:
        qemu_bin: qemu-system-aarch64
        machine: imx8mp-evk
        cpu: cortex-a53
        memory: 2048M
        kernel: barebox-dt-2nd.img
        dtb: imx8mp-evk-qemu.dtb
        display: qemu-default
        extra_args: '-serial null'
      BareboxDriver:
        prompt: 'barebox@[^:]+:[^ ]+ '
        bootstring: 'commandline:'
      BareboxTestStrategy: {}
images:
  barebox-dt-2nd.img: !template "$LG_BUILDDIR/images/barebox-dt-2nd.img"
  imx8mp-evk-qemu.dtb: !template "$LG_BUILDDIR/arch/arm/dts/imx8mp-evk-qemu.dtb"
imports:
  -  ../strategy.py
