targets:
  main:
    drivers:
      QEMUDriver:
        qemu_bin: qemu-system-arm
        machine: sabrelite
        cpu: cortex-a9
        memory: 1024M
        kernel: barebox-dt-2nd.img
        dtb: imx6q-skov-imx6-revc-lt6-qemu.dtb
        display: qemu-default
        extra_args: '-serial null -smp 4'
      BareboxDriver:
        prompt: 'barebox@[^:]+:[^ ]+ '
        bootstring: 'commandline:'
      BareboxTestStrategy:
        # i.MX6Q TO1.2 DIGPROG instead of QEMU's TO1.0
        qemu_writel: {0x020c8260: 0x00630002}
        init_commands:
          # Configured as barebox finds them on the board
          - clk_set_parent ipu2_sel mmdc_ch0_axi_podf
          # Enable the display like the board code does
          - fb0.enable=1
          # Rate the GPMI driver sets for the NAND (ONFI timing mode 5)
          - clk_set_rate gpmi_io 100000000
          # IPU DI rate the HDMI driver sets for the monitor's mode
          - clk_set_rate ipu2_di1_sel 83500000
    options:
      tests:
        - test_clk.py
    clk_tests:
      dump:
        reference: !template "$LG_SRCDIR/test/testdata/skov/imx6q-skov-imx6-revc-lt6.json"
        # IPU-internal clocks, which QEMU doesn't emulate
        ignore: [2400000.ipu@2400000.of_di0_pixel, 2800000.ipu@2800000.of_di1_pixel]
images:
  barebox-dt-2nd.img: !template "$LG_BUILDDIR/images/barebox-dt-2nd.img"
  imx6q-skov-imx6-revc-lt6-qemu.dtb: !template "$LG_BUILDDIR/arch/arm/dts/imx6q-skov-imx6-revc-lt6-qemu.dtb"
imports:
  -  ../strategy.py
