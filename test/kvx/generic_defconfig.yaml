targets:
  main:
    drivers:
      QEMUDriver:
        qemu_bin: qemu-system-kvx
        machine: mppa-coolidge
        memory: 512M
        kernel: barebox
        display: qemu-default
      BareboxDriver:
        prompt: 'barebox@[^:]+:[^ ]+ '
        bootstring: 'commandline:'
      BareboxTestStrategy: {}
images:
  barebox: !template "$LG_BUILDDIR/barebox"
imports:
  -  ../strategy.py
